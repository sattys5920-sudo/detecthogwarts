<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:#1a4fd6;} a:hover{color:#0d2f8f;}
    .win{background:#c0c0c0;height:100%;display:flex;flex-direction:column;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #1c1c1c;border-bottom:2px solid #1c1c1c;font-family:Tahoma,Verdana,sans-serif;}
    .titlebar{background:#000080;color:#fff;font-weight:700;font-size:13px;padding:4px 6px;display:flex;align-items:center;justify-content:space-between;}
    .tbtns{display:flex;gap:3px;}
    .tbtn{width:15px;height:13px;background:#c0c0c0;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #1c1c1c;border-bottom:1px solid #1c1c1c;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000;line-height:1;}
    .menubar{background:#c0c0c0;border-bottom:1px solid #808080;padding:3px 6px;display:flex;gap:14px;font-size:12px;color:#000;}
    .statusbar{background:#c0c0c0;border-top:1px solid #fff;font-size:11px;color:#000;padding:3px 8px;display:flex;justify-content:space-between;gap:8px;}
    .statuscell{border-top:1px solid #808080;border-left:1px solid #808080;padding:1px 8px;}
    .lcd{background:#0d1a12;border-top:2px solid #808080;border-left:2px solid #808080;border-right:2px solid #fff;border-bottom:2px solid #fff;padding:6px 8px;font-family:'VT323',monospace;color:#4ef07c;}
    .eqbar{width:14px;background:linear-gradient(180deg,#ff5a5a 0 15%,#ffd23f 15% 45%,#4ef07c 45% 100%);}
    .track{display:flex;justify-content:space-between;font-size:12px;padding:3px 6px;color:#000;}
    .track.sel{background:#000080;color:#fff;}
    .xbtn{width:30px;height:26px;background:#c0c0c0;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #6b6b6b;border-bottom:2px solid #6b6b6b;display:flex;align-items:center;justify-content:center;}
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
</helmet>

        <div class="titlebar">
          <span>미디어 재생기 - TRACK03.MID</span>

        <div class="menubar"><span>파일</span><span>재생</span><span>옵션</span><span>도움말</span></div>

          <div class="lcd" style="display:flex;justify-content:space-between;font-size:16px;">
            <span>03. STARLIGHT.MID</span><span>02:14 / 04:07</span>
          </div>
          <div style="display:flex;align-items:flex-end;gap:4px;height:70px;background:#0d1a12;border-top:2px solid #808080;border-left:2px solid #808080;border-right:2px solid #fff;border-bottom:2px solid #fff;padding:6px;justify-content:center;">
            <div class="eqbar" style="height:30%;"></div><div class="eqbar" style="height:55%;"></div><div class="eqbar" style="height:80%;"></div><div class="eqbar" style="height:45%;"></div><div class="eqbar" style="height:70%;"></div><div class="eqbar" style="height:95%;"></div><div class="eqbar" style="height:60%;"></div><div class="eqbar" style="height:38%;"></div><div class="eqbar" style="height:66%;"></div><div class="eqbar" style="height:50%;"></div><div class="eqbar" style="height:84%;"></div><div class="eqbar" style="height:42%;"></div>
          </div>
          <div style="flex:1;background:#fff;border-top:2px solid #808080;border-left:2px solid #808080;border-right:2px solid #fff;border-bottom:2px solid #fff;overflow:hidden;">
            <div class="track">1. INTRO.MID<span>00:38</span></div>
            <div class="track">2. LEVEL1.MID<span>03:12</span></div>
            <div class="track sel">3. STARLIGHT.MID<span>04:07</span></div>
            <div class="track">4. BOSS.MID<span>02:55</span></div>
            <div class="track">5. CREDITS.MID<span>01:44</span></div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <div class="xbtn"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 1L1 6l7 5zM15 1L8 6l7 5z" fill="#000"/></svg></div>
            <div class="xbtn"><svg width="12" height="14" viewBox="0 0 12 14"><path d="M0 0l12 7-12 7z" fill="#000"/></svg></div>
            <div class="xbtn"><svg width="12" height="14" viewBox="0 0 12 14"><rect x="1" y="0" width="4" height="14" fill="#000"/><rect x="7" y="0" width="4" height="14" fill="#000"/></svg></div>
            <div class="xbtn"><svg width="12" height="12" viewBox="0 0 12 12"><rect width="12" height="12" fill="#000"/></svg></div>
            <div class="xbtn"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M0 1l7 5-7 5zM8 1l7 5-7 5z" fill="#000"/></svg></div>
            <div style="flex:1;height:8px;background:#fff;border-top:1px solid #808080;border-left:1px solid #808080;border-right:1px solid #fff;border-bottom:1px solid #fff;position:relative;margin-left:8px;">
              <div style="position:absolute;left:70%;top:-3px;width:8px;height:14px;background:#c0c0c0;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #6b6b6b;border-bottom:1px solid #6b6b6b;"></div>
            </div>
          </div>
        </div>
        <div class="statusbar">
          <span class="statuscell">재생 중</span>
          <span class="statuscell">볼륨 70%</span>
        </div>
      </div>
      <div style="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,0) 0px,rgba(0,0,0,0) 1px,rgba(0,0,0,.14) 2px,rgba(0,0,0,0) 3px);mix-blend-mode:multiply;"></div>
      <div style="position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 22px rgba(0,0,0,.55);"></div>
    </div>
  </div>
  <div style="width:100%;display:flex;justify-content:center;align-items:center;gap:20px;margin-top:13px;">
    <div style="width:36px;height:9px;border-radius:5px;background:#c7c1b1;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);"></div>
    <div style="width:13px;height:13px;border-radius:50%;background:#c7c1b1;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);"></div>
  </div>
</div>
</x-dc>
