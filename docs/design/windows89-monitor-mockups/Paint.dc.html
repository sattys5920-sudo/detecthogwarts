<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:#1a4fd6;} a:hover{color:#0d2f8f;}
    .win{background:#c0c0c0;height:100%;display:flex;flex-direction:column;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #1c1c1c;border-bottom:2px solid #1c1c1c;font-family:Tahoma,Verdana,sans-serif;}
    .titlebar{background:#000080;color:#fff;font-weight:700;font-size:13px;padding:4px 6px;display:flex;align-items:center;justify-content:space-between;}
    .tbtns{display:flex;gap:3px;}
    .tbtn{width:15px;height:13px;background:#c0c0c0;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #1c1c1c;border-bottom:1px solid #1c1c1c;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000;line-height:1;}
    .menubar{background:#c0c0c0;border-bottom:1px solid #808080;padding:3px 6px;display:flex;gap:14px;font-size:12px;color:#000;}
    .statusbar{background:#c0c0c0;border-top:1px solid #fff;font-size:11px;color:#000;padding:3px 8px;display:flex;justify-content:space-between;gap:8px;}
    .statuscell{border-top:1px solid #808080;border-left:1px solid #808080;padding:1px 8px;}
    .toolgrid{width:56px;background:#c0c0c0;border-right:1px solid #808080;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;padding:4px;align-content:start;}
    .toolbtn{width:24px;height:22px;background:#c0c0c0;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #808080;border-bottom:1px solid #808080;display:flex;align-items:center;justify-content:center;}
    .toolbtn.active{border-top:1px solid #808080;border-left:1px solid #808080;border-right:1px solid #fff;border-bottom:1px solid #fff;background:#b6b6b6;}
    .swatch{width:16px;height:14px;border:1px solid #555;}
    .bezel{width:460px;height:560px;background:#d9d4c6;border-radius:14px 14px 30px 30px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -8px 14px rgba(0,0,0,.16),0 22px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;padding:20px 26px 16px;font-family:Tahoma,Verdana,sans-serif;}
    .brandrow{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
    .brand{font-size:11px;font-weight:700;letter-spacing:2.5px;color:#726b5a;}
    .led{width:7px;height:7px;border-radius:50%;background:#3ddc5a;box-shadow:0 0 5px #3ddc5a;}
    .screenshell{flex:1;width:100%;background:#0c0d0a;border-radius:6px;box-shadow:inset 0 0 0 3px #16170f,inset 0 0 34px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.35);padding:13px;position:relative;overflow:hidden;}
    .screen{position:absolute;inset:13px;background:#1b1f22;overflow:hidden;}
    .scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,0) 0px,rgba(0,0,0,0) 1px,rgba(0,0,0,.14) 2px,rgba(0,0,0,0) 3px);mix-blend-mode:multiply;}
    .vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 22px rgba(0,0,0,.55);}
    .controls{width:100%;display:flex;justify-content:center;align-items:center;gap:20px;margin-top:13px;}
    .slit{width:36px;height:9px;border-radius:5px;background:#c7c1b1;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);}
    .knob{width:13px;height:13px;border-radius:50%;background:#c7c1b1;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);}
  </style>
</helmet>
<div class="bezel">
  <div class="brandrow"><span class="brand">PC-89</span><div class="led"></div></div>
  <div class="screenshell">
    <div class="screen">
      <div class="win" style="position:absolute;inset:0;">
        <div class="titlebar">
          <span>그림판 - UNTITLED.BMP</span>
          <div class="tbtns"><div class="tbtn">▲</div><div class="tbtn">▼</div><div class="tbtn">✕</div></div>
        </div>
        <div class="menubar"><span>파일</span><span>편집</span><span>보기</span><span>옵션</span><span>도움말</span></div>
        <div style="display:flex;flex:1;min-height:0;">
          <div class="toolgrid">
            <div class="toolbtn active"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 12l1-4 7-7 3 3-7 7z" fill="#f2c14e" stroke="#333"/></svg></div>
            <div class="toolbtn"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="6" width="10" height="6" fill="#e8a6a6" stroke="#333"/></svg></div>
            <div class="toolbtn"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 11h10M3 11c0-3 2-3 2-6 0-2-2-3-2-3l5 3c1 2-1 3-1 6" fill="#6cb2eb" stroke="#333" stroke-width=".8"/></svg></div>
            <div class="toolbtn"><svg width="14" height="14" viewBox="0 0 14 14"><line x1="2" y1="12" x2="12" y2="2" stroke="#333" stroke-width="1.6"/></svg></div>
            <div class="toolbtn"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="3" width="10" height="8" fill="none" stroke="#333" stroke-width="1.4"/></svg></div>
            <div class="toolbtn"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="#333" stroke-width="1.4"/></svg></div>
            <div class="toolbtn"><svg width="12" height="12" viewBox="0 0 12 12"><text x="1" y="10" font-size="10" font-family="Georgia,serif" fill="#333">A</text></svg></div>
            <div class="toolbtn"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="4" cy="4" r="1" fill="#333"/><circle cx="9" cy="3" r="1" fill="#333"/><circle cx="6" cy="8" r="1" fill="#333"/><circle cx="11" cy="9" r="1" fill="#333"/><circle cx="3" cy="10" r="1" fill="#333"/></svg></div>
          </div>
          <div style="flex:1;background:#fff;position:relative;overflow:hidden;">
            <div style="position:absolute;inset:0;background:#bfe4f5;"></div>
            <div style="position:absolute;left:16px;top:14px;width:26px;height:26px;border-radius:50%;background:#ffd23f;"></div>
            <div style="position:absolute;left:0;right:0;bottom:0;height:34%;background:#7bbf6a;"></div>
            <div style="position:absolute;left:38%;bottom:20%;width:80px;height:66px;background:#c8895a;border:2px solid #6b3f22;"></div>
            <div style="position:absolute;left:calc(38% - 6px);bottom:calc(20% + 60px);width:0;height:0;border-left:46px solid transparent;border-right:46px solid transparent;border-bottom:34px solid #a5382f;"></div>
            <div style="position:absolute;left:calc(38% + 30px);bottom:20%;width:18px;height:34px;background:#5a3210;border:2px solid #3a2008;"></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding:4px 8px;border-top:1px solid #808080;">
          <div style="width:22px;height:18px;position:relative;">
            <div style="position:absolute;left:0;top:6px;width:14px;height:12px;background:#000;border:1px solid #555;"></div>
            <div style="position:absolute;left:6px;top:0;width:14px;height:12px;background:#fff;border:1px solid #555;"></div>
          </div>
          <div style="display:flex;flex-wrap:wrap;width:220px;gap:1px;">
            <div class="swatch" style="background:#000"></div><div class="swatch" style="background:#808080"></div><div class="swatch" style="background:#800000"></div><div class="swatch" style="background:#ff0000"></div><div class="swatch" style="background:#808000"></div><div class="swatch" style="background:#ffff00"></div><div class="swatch" style="background:#008000"></div><div class="swatch" style="background:#00ff00"></div><div class="swatch" style="background:#008080"></div><div class="swatch" style="background:#00ffff"></div><div class="swatch" style="background:#000080"></div><div class="swatch" style="background:#0000ff"></div><div class="swatch" style="background:#800080"></div><div class="swatch" style="background:#ff00ff"></div><div class="swatch" style="background:#fff"></div>
          </div>
        </div>
        <div class="statusbar">
          <span class="statuscell">128,64</span>
          <span class="statuscell">640 x 480</span>
        </div>
      </div>
      <div class="scanlines"></div>
      <div class="vignette"></div>
    </div>
  </div>
  <div class="controls"><div class="slit"></div><div class="knob"></div></div>
</div>
</x-dc>
</body>
</html>
