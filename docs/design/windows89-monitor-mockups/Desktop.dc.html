<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:#1a4fd6;} a:hover{color:#0d2f8f;}
    .icontile{display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;}
    .iconlabel{font-family:Tahoma,Verdana,sans-serif;font-size:11px;font-weight:700;color:#fff;text-align:center;line-height:1.2;text-shadow:1px 1px 1px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.5);}
    .taskbar{background:#c0c0c0;border-top:1px solid #fff;box-shadow:0 -1px 0 #808080 inset;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-family:Tahoma,Verdana,sans-serif;}
    .startbtn{display:flex;align-items:center;gap:5px;height:22px;padding:0 8px;background:#c0c0c0;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #6b6b6b;border-bottom:1px solid #6b6b6b;font-size:12px;font-weight:700;color:#000;}
    .clock{height:20px;display:flex;align-items:center;padding:0 8px;background:#c0c0c0;border-top:1px solid #808080;border-left:1px solid #808080;border-right:1px solid #fff;border-bottom:1px solid #fff;font-size:11px;color:#000;}
  </style>
</helmet>
<div style="width:460px;height:560px;background:#d9d4c6;border-radius:14px 14px 30px 30px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -8px 14px rgba(0,0,0,.16),0 22px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;padding:20px 26px 16px;font-family:Tahoma,Verdana,sans-serif;">
  <div style="width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;">
    <span style="font-size:11px;font-weight:700;letter-spacing:2.5px;color:#726b5a;">PC-89</span>
    <div style="width:7px;height:7px;border-radius:50%;background:#3ddc5a;box-shadow:0 0 5px #3ddc5a;"></div>
  </div>
  <div style="flex:1;width:100%;background:#0c0d0a;border-radius:6px;box-shadow:inset 0 0 0 3px #16170f,inset 0 0 34px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.35);padding:13px;position:relative;overflow:hidden;">
    <div style="position:absolute;inset:13px;background:#008080;overflow:hidden;">

      <div style="position:absolute;inset:0;padding:16px 0 30px 14px;display:flex;flex-direction:column;gap:16px;">
        <div class="icontile">
          <svg width="34" height="34" viewBox="0 0 34 34"><rect x="1" y="1" width="32" height="32" rx="4" fill="#dbe6f5" stroke="#33465c" stroke-width="1.2"/><circle cx="17" cy="13" r="6" fill="#f2c48a" stroke="#8a5a2a" stroke-width="1"/><path d="M6 29c1.5-7 8-9 11-9s9.5 2 11 9" fill="#3b6fa8" stroke="#20456e" stroke-width="1"/></svg>
          <span class="iconlabel">프로필</span>
        </div>
        <div class="icontile">
          <svg width="34" height="34" viewBox="0 0 34 34"><path d="M3 6h28v16H14l-6 6v-6H3z" fill="#ffd23f" stroke="#8a6a12" stroke-width="1.2"/><circle cx="10" cy="14" r="1.6" fill="#5a4408"/><circle cx="17" cy="14" r="1.6" fill="#5a4408"/><circle cx="24" cy="14" r="1.6" fill="#5a4408"/></svg>
          <span class="iconlabel">채팅</span>
        </div>
        <div class="icontile">
          <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="14" cy="14" r="9" fill="#eaf4ff" stroke="#2a4a6b" stroke-width="2.4"/><line x1="21" y1="21" x2="30" y2="30" stroke="#2a4a6b" stroke-width="3.4" stroke-linecap="round"/></svg>
          <span class="iconlabel">검색</span>
        </div>
        <div class="icontile">
          <svg width="34" height="30" viewBox="0 0 16 14"><path d="M1 3h5l1.5 2H15a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="#eec95a" stroke="#8a6a12" stroke-width="0.6"/></svg>
          <span class="iconlabel">내 폴더</span>
        </div>
        <div class="icontile">
          <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="#3b7dd8" stroke="#1c3f6e" stroke-width="1.4"/><ellipse cx="17" cy="17" rx="14" ry="6" fill="none" stroke="#cfe4ff" stroke-width="1"/><ellipse cx="17" cy="17" rx="6" ry="14" fill="none" stroke="#cfe4ff" stroke-width="1"/><line x1="3" y1="17" x2="31" y2="17" stroke="#cfe4ff" stroke-width="1"/></svg>
          <span class="iconlabel">인터넷</span>
        </div>
      </div>

      <div class="taskbar" style="position:absolute;left:0;right:0;bottom:0;height:28px;">
        <div class="startbtn">
          <svg width="13" height="13" viewBox="0 0 13 13"><rect x="0" y="0" width="6" height="6" fill="#d94b3a"/><rect x="7" y="0" width="6" height="6" fill="#5aa93a"/><rect x="0" y="7" width="6" height="6" fill="#3a7ed9"/><rect x="7" y="7" width="6" height="6" fill="#e0b930"/></svg>
          시작
        </div>
        <div class="clock">오후 3:47</div>
      </div>

      <div style="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,0) 0px,rgba(0,0,0,0) 1px,rgba(0,0,0,.14) 2px,rgba(0,0,0,0) 3px);mix-blend-mode:multiply;"></div>
      <div style="position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 22px rgba(0,0,0,.55);"></div>
    </div>
  </div>
  <div style="width:100%;display:flex;justify-content:center;align-items:center;gap:20px;margin-top:13px;">
    <div style="width:36px;height:9px;border-radius:5px;background:#c7c1b1;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);"></div>
    <div style="width:13px;height:13px;border-radius:50%;background:#c7c1b1;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);"></div>
  </div>
</div>
</x-dc>
</body>
</html>
