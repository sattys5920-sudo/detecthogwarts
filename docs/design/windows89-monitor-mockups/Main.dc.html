<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:#1a4fd6;} a:hover{color:#0d2f8f;}
    .win{background:#c0c0c0;height:100%;display:flex;flex-direction:column;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #1c1c1c;border-bottom:2px solid #1c1c1c;font-family:Tahoma,Verdana,sans-serif;}
    .titlebar{background:#000080;color:#fff;font-weight:700;font-size:13px;padding:4px 6px;display:flex;align-items:center;justify-content:space-between;}
    .tbtns{display:flex;gap:3px;}
    .tbtn{width:15px;height:13px;background:#c0c0c0;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #1c1c1c;border-bottom:1px solid #1c1c1c;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000;line-height:1;}
    .menubar{background:#c0c0c0;border-bottom:1px solid #808080;padding:3px 6px;display:flex;gap:14px;font-size:12px;color:#000;}
    .toolbar{background:#c0c0c0;border-bottom:1px solid #808080;padding:4px 6px;display:flex;gap:3px;}
    .toolbtn{width:26px;height:24px;background:#c0c0c0;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #808080;border-bottom:1px solid #808080;display:flex;align-items:center;justify-content:center;}
    .statusbar{background:#c0c0c0;border-top:1px solid #fff;font-size:11px;color:#000;padding:3px 8px;display:flex;justify-content:space-between;gap:8px;}
    .statuscell{border-top:1px solid #808080;border-left:1px solid #808080;padding:1px 8px;}
    .sunken{border-top:2px solid #808080;border-left:2px solid #808080;border-right:2px solid #fff;border-bottom:2px solid #fff;background:#fff;}
    .treeitem{display:flex;align-items:center;gap:5px;padding:2px 4px;font-size:12px;color:#000;white-space:nowrap;}
    .treeitem.sel{background:#000080;color:#fff;}
    .fileicon{display:flex;flex-direction:column;align-items:center;gap:3px;width:74px;padding:6px 2px;font-size:11px;color:#000;text-align:center;}
    .fileicon.sel{background:#000080;color:#fff;}
    .bezel{width:460px;height:560px;background:#d9d4c6;border-radius:14px 14px 30px 30px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -8px 14px rgba(0,0,0,.16),0 22px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;padding:20px 26px 16px;font-family:Tahoma,Verdana,sans-serif;}
    .brandrow{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
    .brand{font-size:11px;font-weight:700;letter-spacing:2.5px;color:#726b5a;}
    .led{width:7px;height:7px;border-radius:50%;background:#3ddc5a;box-shadow:0 0 5px #3ddc5a;}
    .screenshell{flex:1;width:100%;background:#0c0d0a;border-radius:6px;box-shadow:inset 0 0 0 3px #16170f,inset 0 0 34px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.35);padding:13px;position:relative;overflow:hidden;}
    .screen{position:absolute;inset:13px;background:#1b1f22;overflow:hidden;}
    .scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,0) 0px,rgba(0,0,0,0) 1px,rgba(0,0,0,.14) 2px,rgba(0,0,0,0) 3px);mix-blend-mode:multiply;}
    .vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 22px rgba(0,0,0,.55);}
    .controls{width:100%;display:flex;justify-content:center;align-items:center;gap:20px;margin-top:13px;}
    .slit{width:36px;height:9px;border-radius:5px;background:#c7c1b1;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);}
    .knob{width:13px;height:13px;border-radius:50%;background:#c7c1b1;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);}
  </style>
</helmet>
<div class="bezel">
  <div class="brandrow"><span class="brand">PC-89</span><div class="led"></div></div>
  <div class="screenshell">
    <div class="screen">
      <div class="win" style="position:absolute;inset:0;">
        <div class="titlebar">
          <span>파일 관리자 - C:\WINDOWS</span>
          <div class="tbtns"><div class="tbtn">▲</div><div class="tbtn">▼</div><div class="tbtn">✕</div></div>
        </div>
        <div class="menubar"><span>파일</span><span>편집</span><span>보기</span><span>도움말</span></div>
        <div class="toolbar">
          <div class="toolbtn"><svg width="16" height="14" viewBox="0 0 16 14"><path d="M1 6h14M8 1v12" stroke="#000" stroke-width="1.6"/></svg></div>
          <div class="toolbtn"><svg width="15" height="12" viewBox="0 0 15 12"><path d="M1 2h5l1.3 1.6H14a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" fill="#eec95a" stroke="#8a6a12"/></svg></div>
          <div class="toolbtn"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="3" y="1" width="8" height="10" fill="#fff" stroke="#333"/><rect x="1" y="3" width="8" height="10" fill="#fff" stroke="#333"/></svg></div>
          <div class="toolbtn"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 12L12 2M2 2l10 10" stroke="#333" stroke-width="1.6"/></svg></div>
        </div>
        <div style="display:flex;flex:1;gap:2px;padding:4px;min-height:0;">
          <div class="sunken" style="width:118px;padding:4px 2px;overflow:hidden;">
            <div class="treeitem sel">
              <svg width="14" height="12" viewBox="0 0 16 14"><path d="M1 3h5l1.5 2H15a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="#e8c14a" stroke="#7a5c10" stroke-width=".6"/></svg>
              C:\
            </div>
            <div class="treeitem" style="padding-left:16px;">
              <svg width="14" height="12" viewBox="0 0 16 14"><path d="M1 3h5l1.5 2H15a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="#e8c14a" stroke="#7a5c10" stroke-width=".6"/></svg>
              WINDOWS
            </div>
            <div class="treeitem" style="padding-left:16px;">
              <svg width="14" height="12" viewBox="0 0 16 14"><path d="M1 3h5l1.5 2H15a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="#e8c14a" stroke="#7a5c10" stroke-width=".6"/></svg>
              GAME
            </div>
            <div class="treeitem" style="padding-left:16px;">
              <svg width="14" height="12" viewBox="0 0 16 14"><path d="M1 3h5l1.5 2H15a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="#e8c14a" stroke="#7a5c10" stroke-width=".6"/></svg>
              DOS
            </div>
          </div>
          <div class="sunken" style="flex:1;padding:6px;display:flex;flex-wrap:wrap;align-content:flex-start;overflow:hidden;">
            <div class="fileicon">
              <svg width="16" height="18" viewBox="0 0 12 14"><path d="M1 0h6l4 4v9a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1z" fill="#fff" stroke="#555"/><path d="M7 0v4h4" fill="none" stroke="#555"/></svg>
              AUTOEXEC.BAT
            </div>
            <div class="fileicon">
              <svg width="16" height="18" viewBox="0 0 12 14"><path d="M1 0h6l4 4v9a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1z" fill="#fff" stroke="#555"/><path d="M7 0v4h4" fill="none" stroke="#555"/></svg>
              CONFIG.SYS
            </div>
            <div class="fileicon">
              <svg width="16" height="18" viewBox="0 0 12 14"><path d="M1 0h6l4 4v9a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1z" fill="#fff" stroke="#555"/><path d="M7 0v4h4" fill="none" stroke="#555"/></svg>
              WIN.INI
            </div>
            <div class="fileicon sel">
              <svg width="16" height="18" viewBox="0 0 12 14"><path d="M1 0h6l4 4v9a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1z" fill="#fff" stroke="#555"/><path d="M7 0v4h4" fill="none" stroke="#555"/></svg>
              README.TXT
            </div>
            <div class="fileicon">
              <svg width="16" height="18" viewBox="0 0 12 14"><rect x="0" y="0" width="12" height="14" rx="1" fill="#c9d6ff" stroke="#33459c"/><rect x="2" y="2" width="8" height="4" fill="#33459c"/></svg>
              SETUP.EXE
            </div>
            <div class="fileicon">
              <svg width="16" height="18" viewBox="0 0 12 14"><path d="M1 0h6l4 4v9a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1z" fill="#fff" stroke="#555"/><path d="M7 0v4h4" fill="none" stroke="#555"/></svg>
              LOGO.BMP
            </div>
          </div>
        </div>
        <div class="statusbar">
          <span class="statuscell">12개 항목</span>
          <span class="statuscell">사용 가능 공간: 1.2MB</span>
        </div>
      </div>
      <div class="scanlines"></div>
      <div class="vignette"></div>
    </div>
  </div>
  <div class="controls"><div class="slit"></div><div class="knob"></div></div>
</div>
</x-dc>
</body>
</html>
