<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:#1a4fd6;} a:hover{color:#0d2f8f;}
    .win{background:#c0c0c0;height:100%;display:flex;flex-direction:column;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #1c1c1c;border-bottom:2px solid #1c1c1c;font-family:Tahoma,Verdana,sans-serif;}
    .titlebar{background:#000080;color:#fff;font-weight:700;font-size:13px;padding:4px 6px;display:flex;align-items:center;justify-content:space-between;}
    .tbtns{display:flex;gap:3px;}
    .tbtn{width:15px;height:13px;background:#c0c0c0;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #1c1c1c;border-bottom:1px solid #1c1c1c;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000;line-height:1;}
    .menubar{background:#c0c0c0;border-bottom:1px solid #808080;padding:3px 6px;display:flex;gap:14px;font-size:12px;color:#000;}
    .disp{background:#0d1a12;color:#4ef07c;font-family:'VT323',monospace;font-size:30px;text-align:right;padding:6px 10px;border-top:2px solid #808080;border-left:2px solid #808080;border-right:2px solid #fff;border-bottom:2px solid #fff;letter-spacing:1px;}
    .calcbtn{background:#c0c0c0;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #6b6b6b;border-bottom:2px solid #6b6b6b;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#000;}
    .calcbtn.op{background:#b8b6c4;}
    .calcbtn.eq{background:#9fb8d8;}
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
</helmet>
<div style="width:460px;height:560px;background:#d9d4c6;border-radius:14px 14px 30px 30px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -8px 14px rgba(0,0,0,.16),0 22px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;padding:20px 26px 16px;font-family:Tahoma,Verdana,sans-serif;">
  <div style="width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;">
    <span style="font-size:11px;font-weight:700;letter-spacing:2.5px;color:#726b5a;">PC-89</span>
    <div style="width:7px;height:7px;border-radius:50%;background:#3ddc5a;box-shadow:0 0 5px #3ddc5a;"></div>
  </div>
  <div style="flex:1;width:100%;background:#0c0d0a;border-radius:6px;box-shadow:inset 0 0 0 3px #16170f,inset 0 0 34px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.35);padding:13px;position:relative;overflow:hidden;">
    <div style="position:absolute;inset:13px;background:#1b1f22;overflow:hidden;">
      <div class="win" style="position:absolute;inset:0;">
        <div class="titlebar">
          <span>계산기</span>
          <div class="tbtns"><div class="tbtn">▲</div><div class="tbtn">✕</div></div>
        </div>
        <div class="menubar"><span>편집</span><span>보기</span><span>도움말</span></div>
        <div style="padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;">
          <div class="disp">1,234,567.</div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:1;">
            <div class="calcbtn op">MC</div><div class="calcbtn op">MR</div><div class="calcbtn op">MS</div><div class="calcbtn op">M+</div>
            <div class="calcbtn op">CE</div><div class="calcbtn op">C</div><div class="calcbtn op">±</div><div class="calcbtn op">√</div>
            <div class="calcbtn">7</div><div class="calcbtn">8</div><div class="calcbtn">9</div><div class="calcbtn op">/</div>
            <div class="calcbtn">4</div><div class="calcbtn">5</div><div class="calcbtn">6</div><div class="calcbtn op">×</div>
            <div class="calcbtn">1</div><div class="calcbtn">2</div><div class="calcbtn">3</div><div class="calcbtn op">-</div>
            <div class="calcbtn" style="grid-column:span 2;">0</div><div class="calcbtn">.</div><div class="calcbtn op">+</div>
            <div class="calcbtn eq" style="grid-column:span 4;">=</div>
          </div>
        </div>
      </div>
      <div style="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,0) 0px,rgba(0,0,0,0) 1px,rgba(0,0,0,.14) 2px,rgba(0,0,0,0) 3px);mix-blend-mode:multiply;"></div>
      <div style="position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 22px rgba(0,0,0,.55);"></div>
    </div>
  </div>
  <div style="width:100%;display:flex;justify-content:center;align-items:center;gap:20px;margin-top:13px;">
    <div style="width:36px;height:9px;border-radius:5px;background:#c7c1b1;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);"></div>
    <div style="width:13px;height:13px;border-radius:50%;background:#c7c1b1;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);"></div>
  </div>
</div>
</x-dc>
</body>
</html>
